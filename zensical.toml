[project]
site_name = "enacit4r-contrib"
site_url = "https://epfl-enac.github.io/enacit4r-contrib/"
site_description = "Data contribution pipeline for EPFL ENAC IT4R projects: intake, validation, submission"
repo_url = "https://github.com/EPFL-ENAC/enacit4r-contrib"
repo_name = "EPFL-ENAC/enacit4r-contrib"
edit_uri = "edit/main/docs/"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Validators" = "validators.md" },
    { "HTTP API" = "http-api.md" },
    { "GitHub App" = "github-app.md" },
    { "Sinks" = "sinks.md" },
    { "Drafts in storage" = "drafts.md" },
    { "Adopt the draft pattern" = "adopt.md" },
    { "Ingest" = "ingest.md" },
    { "Withdraw data" = "withdraw.md" },
    { "Testing" = "testing.md" },
  ] },
  { "Background" = [
    { "Contribution pipelines in five projects" = "research/contribution-pipelines.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EPFL-ENAC/enacit4r-contrib"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
